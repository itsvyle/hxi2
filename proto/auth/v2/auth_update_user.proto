syntax = "proto3";
package auth.v2;

import "auth/v2/permissions.proto";
import "auth/v2/auth_data.proto";
// import something for time type
import "google/protobuf/empty.proto";


service AuthUpdateUserService {
    option (permission_level_service).allow_role = PERMISSION_ANY_AUTHENTICATED;
    option (permission_level_service).csrf_token_header = "X-CSRF-Token";
    option (permission_level_service).csrf_token_cookie = "csrf_token";
    option (permission_level_service).enforce_csrf = true;

    rpc UpdateUsername(UpdateUsernameRequest) returns (google.protobuf.Empty);
    /// For now, do not enable this, as this could allow chaos
    rpc UpdateDiscordID(UpdateDiscordIDRequest) returns (google.protobuf.Empty) {
        option (permission_level).allow_role = PERMISSION_ADMIN;
    }
    rpc AddPassword(AddPasswordRequest) returns (google.protobuf.Empty) {
        option (permission_level).enforce_csrf = false;
    }
    rpc RemovePassword(RemovePasswordRequest) returns (google.protobuf.Empty) { 
        option (permission_level).enforce_csrf = false;
    }
}

message UpdateUsernameRequest {
    string new_username = 1;
    /// To be used by administrators
    optional UserIdentifier user_identifier = 2;
}

message UpdateDiscordIDRequest {
    string new_discord_id = 1;
    /// To be used by administrators
    optional UserIdentifier user_identifier = 2;
}

message AddPasswordRequest {
    string password = 1;
    // This user_id can be provided by a user with the PERMISSION_ADMIN role, to change someone else's password. If not provided, the password will be set for the currently authenticated user.
    UserIdentifier user_identifier = 3;
}

message RemovePasswordRequest {
    // This user_id can be provided by a user with the PERMISSION_ADMIN role, to remove someone else's password. If not provided, the password will be removed for the currently authenticated user.
    UserIdentifier user_identifier = 3;
}