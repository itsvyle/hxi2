syntax = "proto3";
package auth.v2;

import "google/protobuf/descriptor.proto";

extend google.protobuf.MethodOptions {
    optional Permissions permission_level = 50801;
}
extend google.protobuf.ServiceOptions {
    // Set the default permissions for all methods in the service, which can be overridden by method-level options
    optional Permissions permission_level_service = 50802;
}

message Permissions {
    repeated Permission allow_role = 1;
    // is_public indicates that the method is accessible without any authentication at all.
    optional bool is_public = 2;
    // public_url url indicates the potentially different URL that this method is accessible at. It is used to then regulate permissions automatically.
    repeated string public_url = 3;
    optional string csrf_token_header = 4;
    optional string csrf_token_cookie = 5;
    map<string, string> response_cors_headers = 6;
    bool enforce_csrf = 7;
    optional bool is_frontend = 8;
    optional string frontend_static_file = 9;
    // related is a list of routes that are closely related (such as image, css, js); the parser will expand them,
    // inheriting the same permissions as the parent
    repeated Permissions related = 10;
}

enum Permission {
    PERMISSION_PERMISSION_UNSPECIFIED = 0;
    PERMISSION_ADMIN = 1;
    PERMISSION_STUDENT = 2;
    PERMISSION_TEACHER = 3;

    // API Permissions
    PERMISSION_API_JWT = 4;
    PERMISSION_API_LIST_USERS = 5;

    // MISC
    PERMISSION_ANY_AUTHENTICATED = 6;
}