syntax = "proto3";
package auth.v2;

import "auth/v2/permissions.proto";

message SmallData {
    int64 user_id = 1;
    string username = 2;
    string first_name = 3;
    string last_name = 4;
    int64 permissions = 5;
    int32 promotion = 6;
}

message JwtClaims {
    string iss = 1;     // Issuer
    string sub = 2;     // Subject
    string aud = 3;     // Audience
    int64  exp = 4;     // Expiration Time (Unix timestamp)
    int64  nbf = 5;     // Not Before (Unix timestamp)
    int64  iat = 6;     // Issued At (Unix timestamp)
    string jti = 7;     // JWT ID

    bool temporary = 8;
    optional int64 temporary_recheck_after = 9;
    SmallData data = 10;
}