syntax = "proto3";
package auth.v2;


import "google/protobuf/timestamp.proto";



message DBUser {
    int64 id = 1;
    string username = 2;
    string first_name = 3;
    optional string last_name = 4;
    optional string discord_id = 5;
    google.protobuf.Timestamp account_created_date = 6;
    google.protobuf.Timestamp account_modified_date = 7;
    int32 promotion = 8;
    int64 permissions = 9;
    bool is_api = 10;
    int64 attributes = 11;
}

enum Attribute {
    ATTRIBUTE_UNSPECIFIED = 0;
    ATTRIBUTE_CUBE = 1;
    ATTRIBUTE_MPSI = 2;
    ATTRIBUTE_PCSI = 3;
    ATTRIBUTE_BCPST = 4;
}