# note: cargo install --locked connectrpc-codegen protoc-gen-buffa protoc-gen-buffa-packaging
# note: cd generated-proto/js && pnpm i
version: v2
plugins:
    - local: protoc-gen-buffa
      out: generated-proto/rs/buffa
      opt:
          - views=true
          - json=true
          - reflection=true
    - local: protoc-gen-buffa-packaging
      out: generated-proto/rs/buffa
      strategy: all
    - local: protoc-gen-connect-rust
      out: generated-proto/rs/connect
      opt: [buffa_module=crate::proto]
    - local: protoc-gen-buffa-packaging
      out: generated-proto/rs/connect
      strategy: all
      opt: [filter=services]
    - local: ./generated-proto/js/node_modules/.bin/protoc-gen-es
      out: generated-proto/js
      opt: [target=ts]
